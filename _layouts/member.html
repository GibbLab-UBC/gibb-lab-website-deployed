---
layout: default
---

<div class="member-profile-page">

  <a href="{{ '/team/' | relative_url }}" class="member-profile-back">
    ← Back to Team
  </a>

  <div class="member-profile-layout">

    <!-- photo -->
    <div class="member-profile-photo">
      <img
        src="{{ site.baseurl }}/images/team/{{ page.image }}"
        alt="{{ page.title }}">
    </div>

    <!-- bio -->
    <div class="member-profile-bio">
      {{ page.description }}
    </div>

  </div>

</div>
